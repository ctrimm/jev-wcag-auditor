name: "Jev WCAG Auditor"
description: >-
  Audit any URL for WCAG accessibility: deterministic axe-core checks in
  headless Chromium, plus optional Jev adjudication of the judgement calls
  automation can't decide. Fails the step below a score threshold, publishes
  a step summary, and comments on PRs.
author: "Cory Trimm"
branding:
  icon: "eye"
  color: "blue"

inputs:
  url:
    description: >-
      The URL to audit — e.g. a preview deployment URL from Vercel, Netlify,
      or Cloudflare Pages.
    required: true
  wcag-versions:
    description: "Comma-separated WCAG versions to check: any of 2.0, 2.1, 2.2."
    default: "2.1"
  include-level-a:
    description: "Include Level A criteria (AA always includes A)."
    default: "true"
  laws:
    description: >-
      Comma-separated law ids whose mapped WCAG baselines are merged in
      (e.g. '508,ada-title-ii'). Empty means WCAG only.
    default: ""
  jev-mode:
    description: >-
      'off' = axe-core only (no API key needed); 'judgement' = Jev adjudicates
      the semantic criteria automation can't fully decide; 'full' = plus Jev
      second-opinions on serious automated findings.
    default: "off"
  typesafe-api-key:
    description: "TypeSafe API key for Jev. Required when jev-mode is not 'off'."
    default: ""
  fail-below:
    description: >-
      Fail the step if the pass-rate score (0–100) is below this number.
      0 disables the gate.
    default: "0"
  comment:
    description: >-
      Post (or update) a PR comment with the results. Only acts on
      pull_request events.
    default: "true"
  github-token:
    description: "Token used to post the PR comment."
    default: ${{ github.token }}
  summary:
    description: >-
      Write the results to the job's step summary. Turn off when a matrix
      runs many audits and you publish your own combined summary.
    default: "true"
  upload-artifact:
    description: "Upload the full machine-readable report JSON as a workflow artifact."
    default: "true"

outputs:
  score:
    description: "Pass-rate score, 0–100."
    value: ${{ steps.audit.outputs.score }}
  pass:
    description: "Number of criteria that passed."
    value: ${{ steps.audit.outputs.pass }}
  fail:
    description: "Number of criteria that failed."
    value: ${{ steps.audit.outputs.fail }}
  needs-review:
    description: "Number of criteria needing human review."
    value: ${{ steps.audit.outputs.needs-review }}
  criteria-total:
    description: "Total criteria checked."
    value: ${{ steps.audit.outputs.criteria-total }}
  report-path:
    description: "Path to the full wcag-audit-report.json in the workspace."
    value: ${{ steps.audit.outputs.report-path }}

runs:
  using: "composite"
  steps:
    # github.action_path is <repo-root>/action, so ".." is the auditor repo
    # root (package.json, lib/, node_modules). Not the caller's workspace.
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: npm ci

    - name: Install Chromium
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: npx playwright install chromium --with-deps

    - name: Run WCAG audit
      id: audit
      shell: bash
      working-directory: ${{ github.action_path }}/..
      env:
        AUDIT_URL: ${{ inputs.url }}
        AUDIT_WCAG_VERSIONS: ${{ inputs.wcag-versions }}
        AUDIT_INCLUDE_LEVEL_A: ${{ inputs.include-level-a }}
        AUDIT_LAWS: ${{ inputs.laws }}
        AUDIT_JEV_MODE: ${{ inputs.jev-mode }}
        TYPESAFE_API_KEY: ${{ inputs.typesafe-api-key }}
        AUDIT_FAIL_BELOW: ${{ inputs.fail-below }}
        AUDIT_COMMENT: ${{ inputs.comment }}
        AUDIT_SUMMARY: ${{ inputs.summary }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      # Bundle with esbuild (keep-names off): tsx/esbuild's keepNames helper
      # (__name) breaks Playwright's serialization of the page-evaluate
      # function. Playwright stays external (native bindings).
      run: |
        npx esbuild action/run.ts --bundle --platform=node --format=cjs \
          --external:playwright --keep-names=false \
          --outfile=.action-dist/run.cjs
        node .action-dist/run.cjs

    - name: Upload report JSON
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wcag-audit-report
        path: wcag-audit-report.json
        if-no-files-found: warn
